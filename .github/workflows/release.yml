---
name: sonar-release
# This workflow is triggered manually to create and publish a GitHub release
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: Full release version, including build number
        required: true
        type: string
      dryRun:
        description: Flag to enable the dry-run execution
        type: boolean
        default: false

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@v7
    with:
      version: ${{ inputs.version }}
      dryRun: ${{ inputs.dryRun }}
      publishToBinaries: true
      slackChannel: squad-corelang-releases
